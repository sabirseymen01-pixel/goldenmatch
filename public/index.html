<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoldenMatch • Olympus Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- 1. EKRAN: PROFİL DOLDURMA FORMU -->
    <div id="registerView" class="view-screen">
      <div class="header">
        <h2>GOLDENMATCH 🏛️</h2>
        <p class="subtitle">Kutsal profilini tamamla, kaderindeki ruh eşiyle tanış.</p>
      </div>

      <!-- Fotoğraf Yuvaları -->
      <div class="photo-grid">
        <div class="photo-slot main" onclick="pickImage(0)" id="slot-0">
          <span class="slot-icon">⚡</span>
          <img class="slot-preview" alt="Ana Fotoğraf">
          <span class="main-tag">BAŞ PROFİL</span>
        </div>
        <div class="photo-slot" onclick="pickImage(1)" id="slot-1">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Fotoğraf 2">
        </div>
        <div class="photo-slot" onclick="pickImage(2)" id="slot-2">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Fotoğraf 3">
        </div>
        <div class="photo-slot" onclick="pickImage(3)" id="slot-3">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Fotoğraf 4">
        </div>
      </div>
      <input type="file" id="fileSelector" accept="image/*" style="display:none" onchange="onFileSelected(event)">

      <form id="regForm" onsubmit="handleFormSubmit(event)">
        <div class="field">
          <label>Rumuz / İsim</label>
          <input type="text" id="nickname" placeholder="Mecliste görünecek adın" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Yaş</label>
            <input type="number" id="age" min="18" max="99" placeholder="18+" required>
          </div>
          <div class="field">
            <label>Boy (cm)</label>
            <input type="number" id="height" placeholder="180">
          </div>
          <div class="field">
            <label>Kilo (kg)</label>
            <input type="number" id="weight" placeholder="75">
          </div>
        </div>

        <!-- ŞEHİR VE İLÇE SEÇİMİ -->
        <div class="field-row" style="grid-template-columns: 1fr 1fr;">
          <div class="field">
            <label>Şehir (İl)</label>
            <select id="city" onchange="onCityChanged()" required>
              <option value="" disabled selected>Şehir Seç</option>
            </select>
          </div>
          <div class="field">
            <label>İlçe / Semt</label>
            <select id="district" required>
              <option value="" disabled selected>Önce İl Seçin</option>
            </select>
          </div>
        </div>

        <!-- ROL VE İLGİLENİLEN ROL -->
        <div class="field-row" style="grid-template-columns: 1fr 1fr;">
          <div class="field">
            <label>Senin Rolün</label>
            <select id="role" required>
              <option value="" disabled selected>Seçiniz</option>
              <option value="Top">Top</option>
              <option value="Bottom">Bottom</option>
              <option value="Verse">Verse</option>
              <option value="Verse Top">Verse Top</option>
              <option value="Verse Bottom">Verse Bottom</option>
              <option value="Side">Side</option>
              <option value="Trans">Trans</option>
            </select>
          </div>
          <div class="field">
            <label>İlgilendiğin Rol</label>
            <select id="interestedRole" required>
              <option value="Hepsi" selected>Hepsi</option>
              <option value="Top">Top</option>
              <option value="Bottom">Bottom</option>
              <option value="Verse">Verse</option>
              <option value="Verse Top">Verse Top</option>
              <option value="Verse Bottom">Verse Bottom</option>
              <option value="Side">Side</option>
              <option value="Trans">Trans</option>
            </select>
          </div>
        </div>

        <!-- OLİMPOS ARKETİPİ -->
        <div class="field">
          <label>Olimpos Arketipi (Ruhunun Yansıması)</label>
          <select id="archetype" required>
            <option value="" disabled selected>Arketipini Seç</option>
            <option value="Apollon (Işık, Sanat & Karizma)">Apollon (Işık, Sanat & Karizma)</option>
            <option value="Afrodit (Güzellik, Arzu & Zarafet)">Afrodit (Güzellik, Arzu & Zarafet)</option>
            <option value="Ares (Tutku, Güç & Cesaret)">Ares (Tutku, Güç & Cesaret)</option>
            <option value="Hermes (Zeka, Hız & Macera)">Hermes (Zeka, Hız & Macera)</option>
            <option value="Dionisos (Eğlence, Coşku & Özgürlük)">Dionisos (Eğlence, Coşku & Özgürlük)</option>
            <option value="Athena (Bilgelik, Sadakat & Strateji)">Athena (Bilgelik, Sadakat & Strateji)</option>
          </select>
        </div>

        <div class="field">
          <label>Tarz / İfade</label>
          <select id="expression" required>
            <option value="" disabled selected>Seçiniz</option>
            <option value="Maskülen">Maskülen</option>
            <option value="Feminen">Feminen</option>
            <option value="Ladyboy">Ladyboy</option>
            <option value="Twink">Twink</option>
            <option value="Daddy">Daddy</option>
            <option value="Diğer">Diğer</option>
          </select>
        </div>

        <div class="field">
          <label>Hakkında</label>
          <textarea id="bio" rows="3" placeholder="Kendinden, tutkularından ve aradığın ruh eşinden bahset..."></textarea>
        </div>

        <button type="submit" id="saveBtn" class="main-btn">Kutsal Profili Kaydet & Başla</button>
      </form>
    </div>

    <!-- 2. EKRAN: KEŞFET / TINDER KARTLARI -->
    <div id="exploreView" class="view-screen hidden">
      <div class="explore-header">
        <h3>PANTEON ✨</h3>
        <div style="display: flex; gap: 8px;">
          <button class="icon-btn" onclick="openFilterModal()">🔍 Filtrele</button>
          <button class="icon-btn" onclick="openProfileEdit()">⚙️ Profil</button>
        </div>
      </div>

      <!-- Günün Eşleşmesi Vitrini -->
      <div id="dailyPickBanner" class="daily-pick-card hidden">
        <div class="daily-tag">⭐ GÜNÜN KUTSAL SEÇİMİ</div>
        <div id="dailyPickContent" class="daily-pick-body"></div>
      </div>

      <!-- Kaydırma Kartı -->
      <div class="card-stack" id="cardStack">
        <!-- Kartlar dinamik olarak app.js tarafından yerleştirilecek -->
      </div>

      <!-- Aksiyon Butonları -->
      <div class="action-buttons">
        <button class="action-btn pass" onclick="handleCardAction('pass')">❌</button>
        <button class="action-btn like" onclick="handleCardAction('like')">💚</button>
      </div>
    </div>

    <!-- FİLTRELEME MODALI -->
    <div id="filterModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h4>🏛️ Arama Filtresi</h4>
        <div class="field" style="margin-top: 14px;">
          <label>Şehir Filtresi</label>
          <select id="filterCity">
            <option value="Hepsi" selected>Tüm Şehirler</option>
          </select>
        </div>
        <div class="field">
          <label>Rol Filtresi</label>
          <select id="filterRole">
            <option value="Hepsi" selected>Tüm Roller</option>
            <option value="Top">Top</option>
            <option value="Bottom">Bottom</option>
            <option value="Verse">Verse</option>
            <option value="Verse Top">Verse Top</option>
            <option value="Verse Bottom">Verse Bottom</option>
            <option value="Side">Side</option>
            <option value="Trans">Trans</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 18px;">
          <button class="main-btn" style="background: #1f2833; color: #fff;" onclick="closeFilterModal()">Kapat</button>
          <button class="main-btn" onclick="applyFilters()">Uygula</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
