<!-- Şehir Seçim Kapsülü (Modal Tetikleyici) -->
<div class="form-group">
  <label>Şehir Seçimi (30 Büyükşehir)</label>
  <button type="button" class="dropdown-trigger-btn" id="selectedCityBtn" onclick="openSelectionModal('city')">Şehir Seçin...</button>
  <input type="hidden" id="city" required>
</div>

<!-- İlçe Seçim Kapsülü (Modal Tetikleyici) -->
<div class="form-group" id="districtGroup">
  <label>İlçe / Semt Seçimi</label>
  <button type="button" class="dropdown-trigger-btn" id="selectedDistrictBtn" onclick="openSelectionModal('district')">Önce Şehir Seçin...</button>
  <input type="hidden" id="district" required>
</div>

<!-- Rol Seçim Kapsülü (Modal Tetikleyici) -->
<div class="form-group">
  <label>Senin Rolün / Yönelimin</label>
  <button type="button" class="dropdown-trigger-btn" id="selectedRoleBtn" onclick="openSelectionModal('role')">Rolünüzü Seçin...</button>
  <input type="hidden" id="role" required>
</div>

<!-- Aradığın Rol Seçim Kapsülü (Modal Tetikleyici) -->
<div class="form-group">
  <label>Aradığın Rol / Yönelim</label>
  <button type="button" class="dropdown-trigger-btn" id="selectedInterestedRoleBtn" onclick="openSelectionModal('interestedRole')">Hepsi</button>
  <input type="hidden" id="interestedRole" value="Hepsi" required>
</div>

<!-- Olimpos Arketipi Seçim Kapsülü (Modal Tetikleyici) -->
<div class="form-group">
  <label>Olimpos Arketipi</label>
  <button type="button" class="dropdown-trigger-btn" id="selectedArchetypeBtn" onclick="openSelectionModal('archetype')">Arketip Seçin...</button>
  <input type="hidden" id="archetype" required>
</div>
