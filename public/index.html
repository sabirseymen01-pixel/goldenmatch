<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GoldenMatch ✨</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- ÜST NAVİGASYON (KEŞFET, DM KUTUSU, PROFİL, YT PANELİ) -->
    <header id="appNav" class="app-nav hidden">
      <div class="brand-logo" onclick="switchTab('explore')">GoldenMatch ✨</div>
      <div class="nav-actions">
        <button id="ytPanelBtn" class="nav-btn hidden" onclick="openAdminPanel()" title="Yönetici Paneli">👑 YT</button>
        <button class="nav-btn" onclick="openFilterModal()">🔍</button>
        <button class="nav-btn dm-btn" onclick="switchTab('inbox')">
          💬
          <span id="unreadBadge" class="badge-dot hidden"></span>
        </button>
        <button class="nav-btn" onclick="openProfileEdit()">⚙️</button>
      </div>
    </header>

    <!-- 1. EKRAN: PROFİL DOLDURMA FORMU -->
    <div id="registerView" class="view-screen">
      <div class="header">
        <h2>GoldenMatch ✨</h2>
        <p class="subtitle">Profilini tamamla, konumuna en yakın üyelerle eşleş.</p>
      </div>

      <!-- Fotoğraf Yuvaları -->
      <div class="photo-grid">
        <div class="photo-slot main" onclick="pickImage(0)" id="slot-0">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Ana Fotoğraf">
          <span class="main-tag">Ana Fotoğraf</span>
        </div>
        <div class="photo-slot" onclick="pickImage(1)" id="slot-1">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Fotoğraf 2">
        </div>
        <div class="photo-slot" onclick="pickImage(2)" id="slot-2">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Fotoğraf 3">
        </div>
        <div class="photo-slot" onclick="pickImage(3)" id="slot-3">
          <span class="slot-icon">+</span>
          <img class="slot-preview" alt="Fotoğraf 4">
        </div>
      </div>
      <input type="file" id="fileSelector" accept="image/*" style="display:none" onchange="onFileSelected(event)">

      <form id="regForm" onsubmit="handleFormSubmit(event)">
        <div class="field">
          <label>Rumuz / İsim</label>
          <input type="text" id="nickname" placeholder="Görünecek adın" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Yaş</label>
            <input type="number" id="age" min="18" max="99" placeholder="18+" required>
          </div>
          <div class="field">
            <label>Boy (cm)</label>
            <input type="number" id="height" placeholder="180">
          </div>
          <div class="field">
            <label>Kilo (kg)</label>
            <input type="number" id="weight" placeholder="75">
          </div>
        </div>

        <!-- ŞEHİR VE İLÇE SEÇİMİ -->
        <div class="field-row" style="grid-template-columns: 1fr 1fr;">
          <div class="field">
            <label>Şehir (İl)</label>
            <select id="city" onchange="onCityChanged()" required>
              <option value="" disabled selected>Şehir Seç</option>
            </select>
          </div>
          <div class="field">
            <label>İlçe / Semt</label>
            <select id="district" required>
              <option value="" disabled selected>Önce İl Seçin</option>
            </select>
          </div>
        </div>

        <!-- ROL VE İLGİLENİLEN ROL -->
        <div class="field-row" style="grid-template-columns: 1fr 1fr;">
          <div class="field">
            <label>Senin Rolün</label>
            <select id="role" required>
              <option value="" disabled selected>Seçiniz</option>
              <option value="Top">Top</option>
              <option value="Bottom">Bottom</option>
              <option value="Verse">Verse</option>
              <option value="Verse Top">Verse Top</option>
              <option value="Verse Bottom">Verse Bottom</option>
              <option value="Side">Side</option>
              <option value="Trans">Trans</option>
            </select>
          </div>
          <div class="field">
            <label>İlgilendiğin Rol</label>
            <select id="interestedRole" required>
              <option value="Hepsi" selected>Hepsi</option>
              <option value="Top">Top</option>
              <option value="Bottom">Bottom</option>
              <option value="Verse">Verse</option>
              <option value="Verse Top">Verse Top</option>
              <option value="Verse Bottom">Verse Bottom</option>
              <option value="Side">Side</option>
              <option value="Trans">Trans</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Tarz / İfade</label>
          <select id="expression" required>
            <option value="" disabled selected>Seçiniz</option>
            <option value="Maskülen">Maskülen</option>
            <option value="Feminen">Feminen</option>
            <option value="Ladyboy">Ladyboy</option>
            <option value="Twink">Twink</option>
            <option value="Daddy">Daddy</option>
            <option value="Diğer">Diğer</option>
          </select>
        </div>

        <div class="field">
          <label>Hakkında</label>
          <textarea id="bio" rows="3" placeholder="Kendinden ve aradığın özelliklerden kısaca bahset..."></textarea>
        </div>

        <button type="submit" id="saveBtn" class="main-btn">Profili Kaydet & Keşfet</button>
      </form>
    </div>

    <!-- 2. EKRAN: KEŞFET / TINDER KARTLARI -->
    <div id="exploreView" class="view-screen hidden">
      <!-- Günün Eşleşmesi Vitrini -->
      <div id="dailyPickBanner" class="daily-pick-card hidden">
        <div class="daily-tag">⭐ GÜNÜN ÖZEL SEÇİMİ</div>
        <div id="dailyPickContent" class="daily-pick-body"></div>
      </div>

      <!-- Kaydırma Kartı -->
      <div class="card-stack" id="cardStack"></div>

      <!-- Aksiyon Butonları -->
      <div class="action-buttons">
        <button class="action-btn pass" onclick="handleCardAction('pass')">❌</button>
        <button class="action-btn like" onclick="handleCardAction('like')">💚</button>
      </div>
    </div>

    <!-- 3. EKRAN: DM / SOHBET KUTUSU LİSTESİ -->
    <div id="inboxView" class="view-screen hidden">
      <div class="inbox-header">
        <h3>Mesajlar & Eşleşmeler 💬</h3>
        <button class="icon-btn" onclick="switchTab('explore')">← Keşfet'e Dön</button>
      </div>
      <div id="chatList" class="chat-list">
        <div style="text-align: center; color: #888; padding: 40px;">Sohbetler yükleniyor...</div>
      </div>
    </div>

    <!-- 4. EKRAN: BİREBİR ANONİM CHAT VE PARAVAN AÇMA -->
    <div id="chatRoomView" class="view-screen hidden">
      <div class="chat-room-header">
        <button class="icon-btn" onclick="switchTab('inbox')">← Geri</button>
        <div class="chat-partner-info">
          <span id="chatPartnerName" class="partner-name">Kullanıcı</span>
          <span id="chatParavanStatus" class="paravan-status">🎭 Anonim Sohbet</span>
        </div>
        <button id="paravanBtn" class="paravan-action-btn" onclick="requestParavanReveal()">🎭 Paravanı Aç</button>
      </div>

      <!-- Paravan Açılma Bilgi Kutusu -->
      <div id="paravanAlert" class="paravan-alert hidden"></div>

      <!-- Mesaj Akışı -->
      <div id="messageStream" class="message-stream"></div>

      <!-- Mesaj Gönderme Kutusu -->
      <form class="chat-input-bar" onsubmit="sendChatMessage(event)">
        <input type="text" id="chatInput" placeholder="Anonim bir mesaj yaz..." autocomplete="off">
        <button type="submit" class="send-btn">➤</button>
      </form>
    </div>

    <!-- FİLTRELEME MODALI -->
    <div id="filterModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h4>Arama Filtresi</h4>
        <div class="field" style="margin-top: 14px;">
          <label>Şehir Filtresi</label>
          <select id="filterCity">
            <option value="Hepsi" selected>Tüm Şehirler</option>
          </select>
        </div>
        <div class="field">
          <label>Rol Filtresi</label>
          <select id="filterRole">
            <option value="Hepsi" selected>Tüm Roller</option>
            <option value="Top">Top</option>
            <option value="Bottom">Bottom</option>
            <option value="Verse">Verse</option>
            <option value="Verse Top">Verse Top</option>
            <option value="Verse Bottom">Verse Bottom</option>
            <option value="Side">Side</option>
            <option value="Trans">Trans</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 18px;">
          <button class="main-btn" style="background: #2b2b36; color: #fff;" onclick="closeFilterModal()">Kapat</button>
          <button class="main-btn" onclick="applyFilters()">Uygula</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
