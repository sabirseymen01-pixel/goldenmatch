<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GoldenMatch ✨</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="style.css?v=2026">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">

    <header id="appNav" class="app-nav hidden">
      <div class="brand-logo" onclick="switchTab('explore')">
        <span class="gold-text">GOLDEN</span>MATCH
      </div>
      <div class="nav-actions">
        <button id="ytNavBtn" class="nav-btn yt-badge hidden" onclick="switchTab('adminPanel')" title="Yönetici Paneli">👑 YT</button>
        <button class="nav-btn" onclick="openFilterModal()" aria-label="Filtrele">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
        <button class="nav-btn dm-btn" onclick="switchTab('inbox')" aria-label="Mesajlar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="unreadBadge" class="badge-dot hidden"></span>
        </button>
        <button class="nav-btn" onclick="openProfileEdit()" aria-label="Profil">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
        </button>
      </div>
    </header>

    <!-- 1. PROFİL KAYIT / DÜZENLEME -->
    <main id="registerView" class="view-screen">
      <div class="screen-header">
        <h1 class="gold-text">GOLDENMATCH</h1>
        <p class="subtitle">Kutsal profilini ve konumunu mühürle.</p>
      </div>

      <div class="photo-grid">
        <div class="photo-slot main" onclick="pickImage(0)" id="slot-0">
          <div class="slot-placeholder">
            <span class="plus-icon">⚡</span>
            <span class="slot-label">BAŞ PROFİL</span>
          </div>
          <img class="slot-preview" alt="Ana Fotoğraf">
        </div>
        <div class="photo-slot" onclick="pickImage(1)" id="slot-1"><span class="plus-icon">+</span><img class="slot-preview" alt="Foto 2"></div>
        <div class="photo-slot" onclick="pickImage(2)" id="slot-2"><span class="plus-icon">+</span><img class="slot-preview" alt="Foto 3"></div>
        <div class="photo-slot" onclick="pickImage(3)" id="slot-3"><span class="plus-icon">+</span><img class="slot-preview" alt="Foto 4"></div>
      </div>
      <input type="file" id="fileSelector" accept="image/*" style="display:none" onchange="onFileSelected(event)">

      <form id="regForm" onsubmit="handleFormSubmit(event)" class="gold-form">
        <div class="form-group">
          <label>Rumuz / İsim</label>
          <input type="text" id="nickname" placeholder="Mecliste görünecek adın" required>
        </div>

        <div class="form-row-3">
          <div class="form-group"><label>Yaş</label><input type="number" id="age" min="18" max="99" placeholder="18+" required></div>
          <div class="form-group"><label>Boy (cm)</label><input type="number" id="height" placeholder="180"></div>
          <div class="form-group"><label>Kilo (kg)</label><input type="number" id="weight" placeholder="75"></div>
        </div>

        <div class="form-group">
          <label>Şehir Seçimi</label>
          <input type="text" id="citySearchInput" onkeyup="filterCityChips()" placeholder="🔍 Şehir ara...">
          <div class="chip-grid" id="cityChipGrid"></div>
          <input type="hidden" id="city" required>
        </div>

        <div class="form-group" id="districtGroup">
          <label>İlçe / Semt Seçimi</label>
          <div class="chip-grid" id="districtChipGrid"></div>
          <input type="hidden" id="district" required>
        </div>

        <!-- Genişletilmiş Queer Yönelimler / Roller (Kayıt) -->
        <div class="form-group">
          <label>Senin Rolün / Yönelimin</label>
          <div class="chip-grid" data-target="role">
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Top', this)">Top</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Bottom', this)">Bottom</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Verse', this)">Verse</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Verse Top', this)">Verse Top</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Verse Bottom', this)">Verse Bottom</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Side', this)">Side</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Trans', this)">Trans</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Biseksüel', this)">Biseksüel</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Panseksüel', this)">Panseksüel</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Non-Binary', this)">Non-Binary</button>
            <button type="button" class="choice-chip" onclick="selectChip('role', 'Queer / Akışkan', this)">Queer / Akışkan</button>
          </div>
          <input type="hidden" id="role" required>
        </div>

        <div class="form-group">
          <label>Aradığın Rol / Yönelim</label>
          <div class="chip-grid" data-target="interestedRole">
            <button type="button" class="choice-chip selected" onclick="selectChip('interestedRole', 'Hepsi', this)">Hepsi</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Top', this)">Top</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Bottom', this)">Bottom</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Verse', this)">Verse</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Verse Top', this)">Verse Top</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Verse Bottom', this)">Verse Bottom</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Side', this)">Side</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Trans', this)">Trans</button>
            <button type="button" class="choice-chip" onclick="selectChip('interestedRole', 'Biseksüel', this)">Biseksüel</button>
          </div>
          <input type="hidden" id="interestedRole" value="Hepsi" required>
        </div>

        <div class="form-group">
          <label>Olimpos Arketipi</label>
          <div class="chip-grid vertical-chips" data-target="archetype">
            <button type="button" class="choice-chip" onclick="selectChip('archetype', 'Apollon', this)">☀️ Apollon</button>
            <button type="button" class="choice-chip" onclick="selectChip('archetype', 'Afrodit', this)">🕊️ Afrodit</button>
            <button type="button" class="choice-chip" onclick="selectChip('archetype', 'Ares', this)">⚔️ Ares</button>
            <button type="button" class="choice-chip" onclick="selectChip('archetype', 'Hermes', this)">🪽 Hermes</button>
          </div>
          <input type="hidden" id="archetype" required>
        </div>

        <div class="form-group">
          <label>Biyografi</label>
          <textarea id="bio" rows="3" placeholder="Kendinden bahset..."></textarea>
        </div>

        <button type="submit" id="saveBtn" class="primary-btn gold-glow"><span>Profili Mühürle & Başla</span></button>
        
        <!-- Hesap Dondurma / Silme Portu -->
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button type="button" id="deactivateAccountBtn" class="danger-outline-btn hidden" onclick="deactivateMyAccount()" style="flex:1; background:transparent; border:1px solid #ff4757; color:#ff4757; padding:12px; border-radius:14px; cursor:pointer;">🔒 Hesabı Dondur</button>
          <button type="button" id="deleteAccountBtn" class="danger-outline-btn hidden" onclick="deleteMyAccount()" style="flex:1; background:transparent; border:1px solid #ff4757; color:#ff4757; padding:12px; border-radius:14px; cursor:pointer;">🗑️ Hesabı Sil</button>
        </div>
      </form>
    </main>

    <!-- 2. KEŞFET (TINDER KARTLARI) -->
    <main id="exploreView" class="view-screen hidden">
      <div class="card-stage" id="cardStage">
        <div class="tinder-card" id="activeCard">
          <div class="card-loader">Altın kader ağları taranıyor...</div>
        </div>
      </div>

      <div class="swipe-actions">
        <button class="action-circle pass-btn" onclick="triggerCardSwipe('pass')">✕</button>
        <button class="action-circle like-btn" onclick="triggerCardSwipe('like')">❤️</button>
      </div>
    </main>

    <!-- 3. MESAJLAR LİSTESİ -->
    <main id="inboxView" class="view-screen hidden">
      <div class="sub-header">
        <h2>Mesajlar 💬</h2>
        <button class="ghost-btn" onclick="switchTab('explore')">Keşfet</button>
      </div>
      <div id="chatList" class="inbox-list"></div>
    </main>

    <!-- 4. SOHBET ODASI & PARAVAN -->
    <main id="chatRoomView" class="view-screen hidden">
      <div class="chat-header">
        <button class="ghost-btn sm-btn" onclick="switchTab('inbox')">← Geri</button>
        <div class="partner-meta">
          <h3 id="chatPartnerName">Kullanıcı</h3>
          <span id="chatParavanStatus" class="status-indicator">🎭 Anonim Paravan</span>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <button id="paravanBtn" class="paravan-pill" onclick="requestParavanReveal()">🎭 Paravanı Aç</button>
          <button class="report-pill" onclick="reportCurrentPartner()">🚨 Şikayet</button>
          <button class="unmatch-pill" onclick="cancelCurrentMatch()">✕</button>
        </div>
      </div>

      <div id="messageStream" class="chat-stream"></div>

      <!-- Profesyonel Gold Simgeli Medya ve Ses Gönderme Paneli -->
      <form class="chat-composer" onsubmit="sendChatMessage(event)">
        <input type="file" id="chatMediaInput" accept="image/*" style="display:none" onchange="onChatMediaSelected(event)">
        
        <!-- Galeri / Görsel Simgesi -->
        <button type="button" class="chat-action-btn" onclick="document.getElementById('chatMediaInput').click()" title="Fotoğraf Gönder">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
            <path d="M21 15L16 10L5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Sesli Mesaj Simgesi -->
        <button type="button" id="recordAudioBtn" class="chat-action-btn chat-voice-btn" onclick="toggleAudioRecording()" title="Sesli Mesaj Gönder">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 4H3C1.9 4 1 4.9 1 6V15C1 16.1 1.9 17 3 17H7L11 21V17H21C22.1 17 23 16.1 23 15V6C23 4.9 22.1 4 21 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <rect x="10.5" y="7" width="3" height="5" rx="1.5" fill="currentColor"/>
            <path d="M8 10.5C8 12.2 9.3 13.5 11 13.5H13C14.7 13.5 16 12.2 16 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="13.5" x2="12" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <input type="text" id="chatInput" placeholder="Mesajınızı fısıldayın..." autocomplete="off">
        <button type="submit" class="composer-btn">➤</button>
      </form>
    </main>

    <!-- 5. YÖNETİCİ PANELİ (YT) -->
    <main id="adminPanelView" class="view-screen hidden">
      <div class="sub-header">
        <h2 class="gold-text">👑 YT Yönetim Masası</h2>
        <button class="ghost-btn" onclick="switchTab('explore')">Çıkış</button>
      </div>
      <div class="stats-cards" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;">
        <div class="stat-pill" style="background:#171622; padding:10px; border-radius:12px; text-align:center;"><span>Toplam Üye</span><br><strong id="ytStatTotal" style="color:#d4af37;">0</strong></div>
        <div class="stat-pill" style="background:#171622; padding:10px; border-radius:12px; text-align:center;"><span>Aktif</span><br><strong id="ytStatActive" style="color:#2ed573;">0</strong></div>
      </div>
      <div id="adminUserCards" class="admin-scroll-list" style="max-height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
    </main>

    <!-- GELİŞMİŞ FİLTRE MODALI (Günlük 3 Ücretsiz Hak ve Genişletilmiş Roller) -->
    <div id="filterModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeFilterModal()">
      <div class="modal-sheet">
        <div class="sheet-header"><h3>Gelişmiş Filtreler</h3><button class="icon-close" onclick="closeFilterModal()">✕</button></div>
        
        <div style="background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.3); padding:10px; border-radius:10px; margin-bottom:12px; font-size:12px; color:#d4af37; text-align:center;">
          ✨ Günlük Ücretsiz Filtre Hakkı: <strong id="filterRemainingBadge">3 / 3</strong> (Sonrasında Yıldız ⭐ / Premium)
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label>Şehir Filtresi</label>
          <div class="chip-grid" id="filterCityChips"></div>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label>İlçe / Semt (Koordinat Tabanlı) Filtresi</label>
          <div class="chip-grid" id="filterDistrictChips"></div>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label>Yaş Aralığı: <span id="ageRangeLabel" style="color:#d4af37;">18 - 99</span></label>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="number" id="filterMinAge" value="18" min="18" max="99" style="width:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px; color:#fff;" placeholder="Min Yaş">
            <input type="number" id="filterMaxAge" value="99" min="18" max="99" style="width:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px; color:#fff;" placeholder="Max Yaş">
          </div>
        </div>

        <!-- Filtrelerde Genişletilmiş Queer Rol / Yönelim Seçenekleri -->
        <div class="form-group" style="margin-bottom:16px;">
          <label>Rol / Yönelim Filtresi</label>
          <div class="chip-grid" id="filterRoleChips">
            <button type="button" class="choice-chip selected" onclick="setFilterRole('Hepsi', this)">Hepsi</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Top', this)">Top</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Bottom', this)">Bottom</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Verse', this)">Verse</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Verse Top', this)">Verse Top</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Verse Bottom', this)">Verse Bottom</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Side', this)">Side</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Trans', this)">Trans</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Biseksüel', this)">Biseksüel</button>
            <button type="button" class="choice-chip" onclick="setFilterRole('Panseksüel', this)">Panseksüel</button>
          </div>
        </div>

        <button class="primary-btn full" onclick="applyFilters()" style="width:100%;">Filtreleri Uygula</button>
      </div>
    </div>

  </div>

  <script src="app.js?v=2026"></script>
</body>
</html>
