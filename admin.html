<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>GoldenMatch • YT Yönetim Masası</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f0f12; color: #f5f5f7; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5a93c; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #e5a93c; font-size: 22px; }
    .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-box { background: #1a1a22; border: 1px solid #2b2b36; border-left: 4px solid #e5a93c; padding: 12px 20px; border-radius: 8px; flex: 1; text-align: center; }
    .stat-val { font-size: 22px; font-weight: bold; color: #fff; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #1a1a22; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #2b2b36; font-size: 13px; }
    th { background: #121217; color: #e5a93c; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-active { background: #2ed573; color: #000; }
    .badge-banned { background: #ff4757; color: #fff; }
    .btn { padding: 5px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
    .ban-btn { background: #ff4757; color: #fff; }
    .unban-btn { background: #2ed573; color: #000; }
    .thumb { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; }
    .auth-bar { display: flex; gap: 8px; align-items: center; }
    input { background: #1a1a22; border: 1px solid #2b2b36; color: #fff; padding: 6px 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>👑 GoldenMatch Yönetim Masası (YT Paneli)</h1>
    <div class="auth-bar">
      <input type="password" id="adminKey" placeholder="YT Şifresi (Gerekirse)..." value="golden_admin_2026">
      <button class="btn" style="background: #e5a93c; color: #000;" onclick="loadUsers()">Listeyi Yenile</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-box"><div>Toplam Kayıtlı Üye</div><div id="statTotal" class="stat-val">0</div></div>
    <div class="stat-box"><div>Aktif Üyeler</div><div id="statActive" class="stat-val">0</div></div>
    <div class="stat-box"><div>Yasaklı Hesaplar</div><div id="statBanned" class="stat-val">0</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Profil / Rumuz</th>
        <th>Telegram Hesabı</th>
        <th>Konum (İl/İlçe)</th>
        <th>Rol / Tercih</th>
        <th>Fotoğraf Adedi</th>
        <th>Durum</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody id="userTable">
      <tr><td colspan="7" style="text-align: center; padding: 30px;">Kayıtlar yükleniyor...</td></tr>
    </tbody>
  </table>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || '';

    window.addEventListener('DOMContentLoaded', loadUsers);

    async function loadUsers() {
      const key = document.getElementById('adminKey').value;
      try {
        const res = await fetch(`/api/admin/users?userId=${userId}&key=${encodeURIComponent(key)}`);
        const data = await res.json();

        if (!data.success) {
          alert(data.message || 'YT yetkisi bulunamadı!');
          return;
        }

        document.getElementById('statTotal').innerText = data.total;
        document.getElementById('statActive').innerText = data.active;
        document.getElementById('statBanned').innerText = data.banned;

        const tbody = document.getElementById('userTable');
        tbody.innerHTML = '';

        data.users.forEach(u => {
          const photo = u.photos && u.photos[0] ? u.photos[0] : '';
          const tgText = u.username ? `<a href="https://t.me/${u.username}" target="_blank" style="color: #e5a93c;">@${u.username}</a>` : '<span style="color:#777;">Kullanıcı adı yok</span>';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              ${photo ? `<img src="${photo}" class="thumb">` : ''}
              <strong>${u.nickname}</strong> (${u.age})
            </td>
            <td>${tgText} <br><small style="color:#777;">ID: ${u.telegramId}</small></td>
            <td>${u.city} / ${u.district || '-'}</td>
            <td>${u.role} (${u.interestedRole || 'Hepsi'})</td>
            <td>${u.photos ? u.photos.length : 0} Adet</td>
            <td>
              <span class="badge ${u.isBanned ? 'badge-banned' : 'badge-active'}">
                ${u.isBanned ? 'Yasaklı' : 'Aktif'}
              </span>
            </td>
            <td>
              <button class="btn ${u.isBanned ? 'unban-btn' : 'ban-btn'}" onclick="toggleBan('${u.telegramId}')">
                ${u.isBanned ? 'Yasağı Kaldır' : 'Yasakla'}
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        alert('Sunucuyla bağlantı kurulamadı.');
      }
    }

    async function toggleBan(targetId) {
      const key = document.getElementById('adminKey').value;
      if (!confirm('Bu kullanıcının durumunu değiştirmek istiyor musunuz?')) return;

      const res = await fetch('/api/admin/toggle-ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-user-id': userId, 'x-admin-key': key },
        body: JSON.stringify({ targetTelegramId: targetId })
      });
      const data = await res.json();
      if (data.success) loadUsers();
    }
  </script>
</body>
</html>
