<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>GoldenMatch • Olimpos Yönetici Masası</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0b0c10; color: #c5c6c7; padding: 25px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5a93c; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: #e5a93c; font-size: 24px; text-transform: uppercase; letter-spacing: 1.5px; }
    .auth-box { display: flex; gap: 10px; }
    input { background: #1f2833; border: 1px solid #45a29e; color: #fff; padding: 8px 12px; border-radius: 6px; }
    button { background: #e5a93c; color: #000; font-weight: bold; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #1f2833; padding: 18px; border-radius: 10px; border-left: 4px solid #e5a93c; text-align: center; }
    .stat-val { font-size: 26px; font-weight: bold; color: #fff; margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; background: #1f2833; border-radius: 10px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #2f3e46; font-size: 14px; }
    th { background: #141b22; color: #e5a93c; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-active { background: #2ed573; color: #000; }
    .badge-banned { background: #ff4757; color: #fff; }
    .ban-btn { background: #ff4757; color: #fff; padding: 5px 10px; font-size: 12px; border-radius: 4px; }
    .unban-btn { background: #2ed573; color: #000; padding: 5px 10px; font-size: 12px; border-radius: 4px; }
    .thumb { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 8px; border: 1px solid #e5a93c; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏛️ GoldenMatch Yönetim Masası</h1>
    <div class="auth-box">
      <input type="password" id="adminKey" placeholder="Yönetici Anahtarı..." value="olympus_admin_777">
      <button onclick="fetchAdminData()">Verileri Çek</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div>Toplam Üye</div><div id="statTotal" class="stat-val">0</div></div>
    <div class="stat-card"><div>Aktif Üyeler</div><div id="statActive" class="stat-val">0</div></div>
    <div class="stat-card"><div>Yasaklı Hesaplar</div><div id="statBanned" class="stat-val">0</div></div>
    <div class="stat-card"><div>Toplam Eşleşme</div><div id="statMatches" class="stat-val">0</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Profil / Rumuz</th>
        <th>Telegram Bilgisi</th>
        <th>Şehir / İlçe</th>
        <th>Rol / Arketip</th>
        <th>Fotoğraf</th>
        <th>Durum</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody id="userTableBody">
      <tr><td colspan="7" style="text-align:center; padding: 30px;">Yönetici anahtarınızı girip 'Verileri Çek' butonuna basınız.</td></tr>
    </tbody>
  </table>

  <script>
    async function fetchAdminData() {
      const key = document.getElementById('adminKey').value;
      try {
        const res = await fetch(`/api/admin/dashboard?key=${encodeURIComponent(key)}`);
        const data = await res.json();

        if (!data.success) {
          alert(data.message || 'Yetki reddedildi!');
          return;
        }

        document.getElementById('statTotal').innerText = data.stats.totalUsers;
        document.getElementById('statActive').innerText = data.stats.activeUsers;
        document.getElementById('statBanned').innerText = data.stats.bannedUsers;
        document.getElementById('statMatches').innerText = data.stats.totalMatches;

        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        data.users.forEach(u => {
          const mainPhoto = u.photos && u.photos[0] ? u.photos[0] : '';
          const tgLink = u.username !== 'Gizli' ? `<a href="https://t.me/${u.username}" target="_blank" style="color:#45a29e;">@${u.username}</a>` : '<span style="color:#888;">Gizli</span>';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              ${mainPhoto ? `<img src="${mainPhoto}" class="thumb">` : ''}
              <strong>${u.nickname}</strong> (${u.age})
            </td>
            <td>${tgLink} <br><small style="color:#777;">ID: ${u.telegramId}</small></td>
            <td>${u.city} / ${u.district || '-'}</td>
            <td><strong>${u.role}</strong> • <em style="color:#e5a93c;">${u.archetype}</em></td>
            <td>${u.photoCount} Adet</td>
            <td>
              <span class="badge ${u.isBanned ? 'badge-banned' : 'badge-active'}">
                ${u.isBanned ? 'Yasaklı' : 'Aktif'}
              </span>
            </td>
            <td>
              <button class="${u.isBanned ? 'unban-btn' : 'ban-btn'}" onclick="toggleBan('${u.telegramId}')">
                ${u.isBanned ? 'Yasağı Kaldır' : 'Yasakla'}
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        alert('Sunucuya bağlanılamadı.');
      }
    }

    async function toggleBan(telegramId) {
      const key = document.getElementById('adminKey').value;
      if (!confirm('Bu kullanıcının durumunu değiştirmek istediğinize emin misiniz?')) return;

      const res = await fetch('/api/admin/toggle-ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
        body: JSON.stringify({ targetTelegramId: telegramId })
      });
      const data = await res.json();
      if (data.success) fetchAdminData();
    }
  </script>
</body>
</html>
